apiVersion: 1

groups:
  - orgId: 1
    name: system-alerts
    folder: Observability
    interval: 30s
    rules:
      - uid: high-cpu-usage
        title: High CPU Usage
        condition: B

        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: '100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A

          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold

        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: CPU usage has remained above 80% for more than one minute.
        labels:
          severity: warning
        isPaused: false
